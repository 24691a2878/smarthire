<!DOCTYPE html>
<html>
<head>
<title>SmartHire</title>
<style>
body{background:#667eea;display:flex;justify-content:center;padding:30px;font-family:Arial}
.container{background:white;padding:30px;border-radius:15px;width:500px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:#667eea;color:white;font-weight:bold;border:none}
.result{margin-top:20px;padding:15px;background:#f0f0ff;border-radius:10px}
.logs{margin-top:15px;background:#111;color:#0f0;padding:12px;border-radius:8px;font-family:monospace;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>SmartHire</h1>
<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<input type="text" name="name" placeholder="Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="file" name="resume" accept=".pdf" required>
<button type="submit">Analyze</button>
</form>
{% if result %}
<div class="result">
<p>Name: {{ result.name }}</p>
<p>Score: {{ result.score }}%</p>
<p>Status: {{ result.status }}</p>
</div>
{% endif %}
{% if logs %}
<div class="logs">
{% for log in logs %}
<div>> {{ log }}</div>
{% endfor %}
</div>
{% endif %}
</div>
</body>
</html>
